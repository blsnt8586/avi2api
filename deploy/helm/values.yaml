image:
  repository: ghcr.io/example/leonardo2api
  tag: latest
  pullPolicy: IfNotPresent
api:
  replicas: 2
worker:
  replicas: 2
  concurrency: 64
service:
  port: 8080
config:
  databaseURL: ""
  redisAddr: ""
  redisPassword: ""
  publicBaseURL: "https://leonardo2api.example.com"
  schemaVersion: "1.231.0"
secret:
  masterKey: ""
  adminUsername: admin
  adminPassword: ""
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
