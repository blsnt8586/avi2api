x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    network_mode: host
    environment:
      LEO_MODE: all
      LEO_HTTP_ADDR: ${LEO_HTTP_ADDR:-0.0.0.0:18080}
      LEO_DATABASE_URL: ${LEO_DATABASE_URL:-postgres://leonardo:leonardo@127.0.0.1:${LEO_POSTGRES_HOST_PORT:-15432}/leonardo?sslmode=disable}
      LEO_DATABASE_MAX_CONNS: ${LEO_DATABASE_MAX_CONNS:-64}
      LEO_REDIS_ADDR: ${LEO_REDIS_ADDR:-127.0.0.1:${LEO_REDIS_HOST_PORT:-16379}}
      LEO_REDIS_PASSWORD: ${LEO_REDIS_PASSWORD:-}
      LEO_MASTER_KEY: ${LEO_MASTER_KEY}
      LEO_ADMIN_USERNAME: ${LEO_ADMIN_USERNAME:-admin}
      LEO_ADMIN_PASSWORD: ${LEO_ADMIN_PASSWORD}
      LEO_SESSION_SYNC_TOKEN: ${LEO_SESSION_SYNC_TOKEN}
      LEO_COOKIE_SECURE: ${LEO_COOKIE_SECURE:-false}
      LEO_PUBLIC_BASE_URL: ${LEO_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
      LEO_SCHEMA_VERSION: 1.258.0
      ADOBE_SUBMIT_API_KEY: ${ADOBE_SUBMIT_API_KEY}
      ADOBE_CREDITS_API_KEY: ${ADOBE_CREDITS_API_KEY}
      ADOBE_ACCOUNT_SUBMIT_INTERVAL: ${ADOBE_ACCOUNT_SUBMIT_INTERVAL:-0s}
      LEO_POLL_INTERVAL: ${LEO_POLL_INTERVAL:-3s}
      LEO_TASK_TIMEOUT: ${LEO_TASK_TIMEOUT:-30m}
      LEO_TASK_LEASE: ${LEO_TASK_LEASE:-60s}
      LEO_QUEUE_TIMEOUT: ${LEO_QUEUE_TIMEOUT:-30m}
      LEO_TASK_ASSET_DIR: /data/task-assets
      LEO_MAX_VIDEO_BYTES: ${LEO_MAX_VIDEO_BYTES:-209715200}
      LEO_MAX_AUDIO_BYTES: ${LEO_MAX_AUDIO_BYTES:-52428800}
      LEO_MAX_MULTIPART_BYTES: ${LEO_MAX_MULTIPART_BYTES:-419430400}
      LEO_BALANCE_RECONCILE_DELAY: ${LEO_BALANCE_RECONCILE_DELAY:-2s}
      LEO_BALANCE_REFRESH_WORKERS: ${LEO_BALANCE_REFRESH_WORKERS:-32}
      LEO_BALANCE_REFRESH_PER_PROXY: ${LEO_BALANCE_REFRESH_PER_PROXY:-1}
      LEO_PROXY_CONTROL_MIN_INTERVAL: ${LEO_PROXY_CONTROL_MIN_INTERVAL:-20s}
      LEO_PROXY_CONTROL_LEASE: ${LEO_PROXY_CONTROL_LEASE:-90s}
      LEO_TASK_DISPATCHER_CONCURRENCY: ${LEO_TASK_DISPATCHER_CONCURRENCY:-128}
      LEO_API_KEY_QUEUE_MULTIPLIER: ${LEO_API_KEY_QUEUE_MULTIPLIER:-2}
      LEO_UNCERTAIN_ACCOUNT_LIMIT: ${LEO_UNCERTAIN_ACCOUNT_LIMIT:-1}
      LEO_UNCERTAIN_PROXY_LIMIT: ${LEO_UNCERTAIN_PROXY_LIMIT:-3}
      LEO_UNCERTAIN_PROVIDER_LIMIT: ${LEO_UNCERTAIN_PROVIDER_LIMIT:-5}
      LEO_SHARED_CIRCUIT_WINDOW: ${LEO_SHARED_CIRCUIT_WINDOW:-30s}
      LEO_SHARED_CIRCUIT_COOLDOWN: ${LEO_SHARED_CIRCUIT_COOLDOWN:-1m}
      LEO_PROVIDER_CIRCUIT_FAILURES: ${LEO_PROVIDER_CIRCUIT_FAILURES:-5}
      LEO_PROXY_CIRCUIT_FAILURES: ${LEO_PROXY_CIRCUIT_FAILURES:-3}
      LEO_GENERATION_INFLIGHT: ${LEO_GENERATION_INFLIGHT:-200}
      LEO_MULTIPART_INFLIGHT: ${LEO_MULTIPART_INFLIGHT:-8}
      LEO_SYNC_INFLIGHT: ${LEO_SYNC_INFLIGHT:-10}
      LEO_REQUEST_LOG_WORKERS: ${LEO_REQUEST_LOG_WORKERS:-4}
      LEO_REQUEST_LOG_BUFFER: ${LEO_REQUEST_LOG_BUFFER:-4096}
      LEO_RATE_LIMIT_PER_MINUTE: ${LEO_RATE_LIMIT_PER_MINUTE:-60}
      LEO_RATE_LIMIT_PER_HOUR: ${LEO_RATE_LIMIT_PER_HOUR:-1000}
      LEO_DAILY_IMAGE_LIMIT: ${LEO_DAILY_IMAGE_LIMIT:-100}
      LEO_IP_RATE_LIMIT_PER_MINUTE: ${LEO_IP_RATE_LIMIT_PER_MINUTE:-120}
      LEO_ACCOUNT_SUBMIT_INTERVAL: ${LEO_ACCOUNT_SUBMIT_INTERVAL:-8s}
      LEO_CIRCUIT_FAILURES: ${LEO_CIRCUIT_FAILURES:-3}
      LEO_CIRCUIT_COOLDOWN: ${LEO_CIRCUIT_COOLDOWN:-10m}
      LEO_UPSTREAM_429_COOLDOWN: ${LEO_UPSTREAM_429_COOLDOWN:-2m}
      LEO_SESSION_REFRESH_AHEAD: ${LEO_SESSION_REFRESH_AHEAD:-15m}
      LEO_SESSION_REFRESH_SCAN_INTERVAL: ${LEO_SESSION_REFRESH_SCAN_INTERVAL:-1m}
      LEO_SESSION_REFRESH_MIN_FRESH: ${LEO_SESSION_REFRESH_MIN_FRESH:-20m}
      LEO_SESSION_REFRESH_WORKERS: ${LEO_SESSION_REFRESH_WORKERS:-32}
      LEO_SESSION_REFRESH_BATCH: ${LEO_SESSION_REFRESH_BATCH:-1000}
      LEO_SESSION_REFRESH_LEASE: ${LEO_SESSION_REFRESH_LEASE:-2m}
      LEO_SESSION_BROWSER_LEASE: ${LEO_SESSION_BROWSER_LEASE:-8m}
      LEO_SESSION_REFRESH_IDLE_POLL: ${LEO_SESSION_REFRESH_IDLE_POLL:-2s}
      LEO_SESSION_WORKER_ALLOW_REMOTE: ${LEO_SESSION_WORKER_ALLOW_REMOTE:-false}
      LEO_HISTORY_CLEANUP_INTERVAL: ${LEO_HISTORY_CLEANUP_INTERVAL:-1h}
      LEO_HISTORY_CLEANUP_BATCH: ${LEO_HISTORY_CLEANUP_BATCH:-10000}
      LEO_TASK_EVENT_RETENTION: ${LEO_TASK_EVENT_RETENTION:-2160h}
      LEO_OUTBOX_RETENTION: ${LEO_OUTBOX_RETENTION:-720h}
      LEO_SESSION_JOB_RETENTION: ${LEO_SESSION_JOB_RETENTION:-720h}
      LEO_API_REQUEST_LOG_RETENTION: ${LEO_API_REQUEST_LOG_RETENTION:-720h}
      LEO_AUDIT_LOG_RETENTION: ${LEO_AUDIT_LOG_RETENTION:-8760h}
      LEO_RECONCILIATION_RETENTION: ${LEO_RECONCILIATION_RETENTION:-17520h}
    volumes:
      - /data/task-assets:/data/task-assets
